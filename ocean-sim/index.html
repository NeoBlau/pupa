<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ocean Simulator</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%227%22 fill=%22%233987e5%22/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="topbar">
      <h1 data-t="title"></h1>
      <nav class="tabs" role="tablist">
        <button data-mode="dive" data-t="modeDive" role="tab"></button>
        <button data-mode="map" data-t="modeMap" role="tab"></button>
        <button data-mode="lab" data-t="modeLab" role="tab"></button>
      </nav>
      <div class="warp">
        <span data-t="timeWarp"></span>
        <button data-warp="1">×1</button>
        <button data-warp="10">×10</button>
        <button data-warp="100">×100</button>
        <button id="pause"></button>
      </div>
      <div class="lang">
        <button data-lang="ru">RU</button><button data-lang="en">EN</button>
      </div>
    </header>

    <main>
      <section id="mode-dive" class="mode">
        <div class="dive-grid">
          <div class="viewport">
            <canvas id="view3d"></canvas>
            <div class="hud">
              <div class="hud-depth"><span id="hud-depth">0</span><small> m</small></div>
              <div id="hud-sub" class="hud-sub"></div>
              <div id="hud-alert" class="hud-alert" hidden></div>
            </div>
            <div id="encounter" class="encounter" hidden></div>
            <div class="controls">
              <label><span data-t="vb"></span> <input id="vb" type="range" min="0" max="1" step="0.01" value="0.5" /> <output id="vb-out"></output></label>
              <button id="drop" data-t="dropWeights"></button>
              <button id="emerg" class="danger" data-t="emergency"></button>
              <button id="lights" data-t="lights" aria-pressed="true"></button>
              <button id="photo" data-t="photo"></button>
              <div class="pad">
                <button data-thr="0,1">▲</button><button data-thr="-1,0">◀</button><button data-thr="1,0">▶</button><button data-thr="0,-1">▼</button>
              </div>
            </div>
            <p class="help" data-t="controlsHelp"></p>
          </div>
          <aside class="instruments">
            <div class="source-line"><span data-t="dataSource"></span>: <span id="data-src"></span></div>
            <table id="readings"></table>
            <div class="exports">
              <button id="exp-ctd" data-t="exportCTD"></button>
              <button id="exp-log" data-t="exportLog"></button>
            </div>
          </aside>
        </div>
        <div class="charts">
          <div class="chart-block">
            <h3 data-t="profiles"></h3>
            <div class="multiples" id="multiples"></div>
          </div>
          <div class="chart-block">
            <h3 data-t="tsDiagram"></h3>
            <canvas id="ts" class="chart-lg"></canvas>
          </div>
          <div class="chart-block">
            <h3 data-t="spectrum"></h3>
            <canvas id="spec" class="chart-lg"></canvas>
          </div>
          <div class="chart-block log-block">
            <h3 data-t="log"></h3>
            <ol id="log" class="log"></ol>
          </div>
        </div>
      </section>

      <section id="mode-map" class="mode" hidden>
        <div class="map-grid">
          <div>
            <canvas id="map" class="map"></canvas>
            <p class="hint" id="map-hint"></p>
          </div>
          <aside class="map-side">
            <label><span data-t="vehicle"></span> <select id="vehicle"></select></label>
            <p id="vehicle-notes" class="notes"></p>
            <label><span data-t="month"></span> <select id="month"></select></label>
            <h3 data-t="mission"></h3>
            <ul id="missions" class="missions"></ul>
            <div id="pick" class="pick"></div>
            <button id="start" class="primary" data-t="start"></button>
          </aside>
        </div>
      </section>

      <section id="mode-lab" class="mode" hidden>
        <div class="lab-grid" id="lab"></div>
      </section>
    </main>

    <dialog id="formula">
      <h3 id="f-title"></h3>
      <pre id="f-tex"></pre>
      <p id="f-explain"></p>
      <h4 data-t="source"></h4>
      <ul id="f-refs"></ul>
      <form method="dialog"><button>OK</button></form>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
